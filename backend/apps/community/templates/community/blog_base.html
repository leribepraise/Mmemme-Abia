<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blog | Mmemme Abia{% endblock %}</title>
  <meta name="description" content="{% block description %}News, guides and stories from Abia State.{% endblock %}">
  <link rel="canonical" href="{{ canonical }}">
  {% block head %}{% endblock %}
  <style>
    *{box-sizing:border-box}body{margin:0;color:#243329;background:#f6f7f3;font:17px/1.75 system-ui,sans-serif}a{color:#265f27}header{background:white;border-bottom:1px solid #dde4db}nav{max-width:1120px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:24px;padding:18px 24px}nav img{width:140px}nav a{text-decoration:none;font-weight:600}main{max-width:1040px;margin:40px auto;padding:0 24px;min-height:65vh}h1{font-size:clamp(30px,5vw,48px);line-height:1.2;color:#173c21}h2{line-height:1.3}.article-body{background:white;padding:clamp(18px,4vw,48px);border-radius:16px;overflow-wrap:anywhere}.article-body h2{font-size:1.8em}.article-body h3{font-size:1.4em}.article-body h4{font-size:1.15em}.article-body img{max-width:100%;height:auto;border-radius:8px}.article-body table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}.article-body td,.article-body th{border:1px solid #bdc9bb;padding:10px;min-width:100px}.article-body th{background:#eef3e9}.article-body blockquote{border-left:4px solid #fd6c11;padding:8px 24px;background:#faf5ed}.article-body pre{overflow:auto}.cover{width:100%;max-height:520px;object-fit:cover;border-radius:14px}.meta{color:#596559}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chips a{border:1px solid #cbd7c8;padding:3px 12px;border-radius:20px;text-decoration:none;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:24px}.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 16px #183e2010}.card img{width:100%;height:210px;object-fit:cover}.card div{padding:20px}.card h2{margin:0 0 12px}.card h2 a{text-decoration:none}.pagination{display:flex;gap:20px;margin:30px 0}footer{padding:30px 24px;text-align:center;background:#173c21;color:white}footer a{color:white}.preview{background:#fff0c2;padding:14px;text-align:center}input,button{font:inherit;padding:10px 16px;border:1px solid #b6c3b3;border-radius:8px}button{background:#265f27;color:white;cursor:pointer}form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
  </style>
</head>
<body>
{% if preview %}<div class="preview">Private preview — this article has not been published.</div>{% endif %}
<header><nav aria-label="Main navigation"><a href="/"><img src="/logo.png" alt="Mmemme Abia"></a><a href="/events">Events</a><a href="/hotel">Hotels</a><a href="/food">Food</a><a href="/tourism">Tourism</a><a href="/blog" aria-current="page">Blog</a></nav></header>
<main>{% block content %}{% endblock %}</main>
<footer>Mmemme Abia · <a href="/contact">Contact us</a> · <a href="/blog-editor/login">Blog editor</a></footer>
</body>
</html>
