<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ event.title }} | Mmemme Abia</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ canonical }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mmemme Abia">
  <meta property="og:title" content="{{ event.title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="{{ image }}">
  <meta property="og:image:alt" content="{{ event.title }} event poster">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ event.title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ image }}">
</head>
<body>
  <div id="root"><main style="max-width:560px;margin:40px auto;padding:20px;font-family:system-ui,sans-serif">
    <p>Mmemme Abia</p>
    <img src="{{ image }}" alt="{{ event.title }} event poster" style="width:100%;max-height:420px;object-fit:contain">
    <h1>{{ event.title }}</h1><p>{{ description }}</p>
    <p>{{ event.start_datetime|date:"j F Y, g:i a" }} · {{ event.venue }}, {{ event.city }}</p>
    <a href="{{ signup_url }}">Continue to event</a>
    <noscript><p>Enable JavaScript to sign up or log in and continue to this event.</p></noscript>
  </main></div>
  <script src="/event-share-loader.js" defer></script>
</body>
</html>
