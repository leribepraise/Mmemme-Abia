name: Production checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mmemme
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: mmemme_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mmemme"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-production.txt
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements-production.txt --no-deps --disable-pip
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: python manage.py test tests --settings=config.settings.test_postgres --noinput
      - run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.production
        env:
          SECRET_KEY: ci-only-security-check-not-a-deployment-secret-xxxxxxxxxxxxxxxxxxxx
          ALLOWED_HOSTS: app.example.test
          DATABASE_URL: postgresql://mmemme:local-test-only@localhost:5432/mmemme_test
          REDIS_URL: redis://localhost:6379/0
          EMAIL_HOST: mail.example.test
          EMAIL_HOST_USER: ci
          EMAIL_HOST_PASSWORD: ci-placeholder
          DEFAULT_FROM_EMAIL: noreply@example.test
          FRONTEND_URL: https://app.example.test
          PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: my-project/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build
