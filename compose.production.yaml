# Keep the API bound to loopback. Terminate HTTPS at a trusted reverse proxy.
# Supply secrets through a deployment secret store or an untracked backend/.env.production.
name: mmemme-abia
x-backend: &backend
  build: ./backend
  env_file: backend/.env.production
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  volumes:
    - media:/app/media
    - static:/app/staticfiles
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *backend
    command: ["python", "manage.py", "process_jobs"]
  db:
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    restart: unless-stopped
    environment:
      POSTGRES_DB: mmemme
      POSTGRES_USER: mmemme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmemme -d mmemme"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres:
  redis:
  media:
  static:
